<style>
  :root {
    /* The logo is a fixed-colour brand asset, so the page stays light in every theme. */
    color-scheme: light;
    --paper: #fffcfa;
    --rule: #f4e6da;
    --ink: #2b1508;
    --ink-2: #6b574c;
    --accent: #f77124;
    --accent-ink: #a3400a;
  }


  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  /* Ruled workbook ground, faded at the edges so it never fights the text. */
  .sheet {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 40px;
    padding: 48px 24px;
    text-align: center;
  }

  .sheet::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(to bottom, var(--rule) 0 1px, transparent 1px 32px);
    -webkit-mask-image: radial-gradient(70% 62% at 50% 46%, #000 18%, transparent 82%);
    mask-image: radial-gradient(70% 62% at 50% 46%, #000 18%, transparent 82%);
    pointer-events: none;
  }

  .sheet > * { position: relative; }

  .logo { display: block; width: auto; height: 58px; }


  main { max-width: 34rem; }

  h1 {
    margin: 0 0 16px;
    font-size: clamp(1.9rem, 5.5vw, 2.85rem);
    line-height: 1.08;
    letter-spacing: -.03em;
    font-weight: 800;
  }

  p {
    margin: 0 auto;
    max-width: 44ch;
    color: var(--ink-2);
  }

  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 20px;
    align-items: center;
    justify-content: center;
    margin-top: 30px;
  }

  .btn {
    appearance: none;
    border: 0;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    border-radius: 999px;
    padding: 13px 26px;
    background: var(--accent);
    color: #fff;
    transition: transform .12s ease, filter .12s ease;
  }

  .btn:hover { filter: brightness(1.06); }
  .btn:active { transform: translateY(1px); }

  .btn-quiet {
    color: var(--accent-ink);
    font-weight: 600;
    text-decoration: none;
    padding: 13px 2px;
    border-bottom: 1px solid transparent;
  }

  .btn-quiet:hover { border-bottom-color: currentColor; }

  :focus-visible {
    outline: 2px solid var(--accent-ink);
    outline-offset: 3px;
    border-radius: 6px;
  }

  /* Beats the position: relative that .sheet > * sets. */
  .sheet > footer {
    position: absolute;
    left: 24px;
    right: 24px;
    bottom: 28px;
    color: var(--ink-2);
    font-size: .88rem;
  }

  footer a { color: inherit; }

  @media (max-width: 600px) {
    .sheet { gap: 32px; justify-content: flex-start; padding-top: 14vh; }
    .logo { height: 44px; }
    .sheet > footer { position: static; margin-top: 8px; }
  }
</style>
